# Render Blueprint for the AI Travel Planner.
#
# One web service (Django behind gunicorn) and one managed PostgreSQL
# database. Render reads this file when you create a Blueprint from the
# repository.
#
# The site is deployed to Vercel as well. Nothing here conflicts with
# vercel.json - each host reads its own file and ignores the other.
#
# The build step installs dependencies, collects the CSS/JS that WhiteNoise
# serves, and runs the migrations, so a fresh deploy comes up with its
# tables already in place.

services:
  - type: web
    name: ai-travel-planner
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/Dhikesh123/-ai-travel-planner-
    branch: main
    autoDeploy: true
    healthCheckPath: /
    # collectstatic needs no database, so it belongs in the build.
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input
    # migrate runs here, not in the build, because the database's internal
    # hostname only resolves on Render's private network at RUN time - a
    # build-time migrate dies with "failed to resolve host dpg-...". A
    # pre-deploy command would be the tidier home for it, but those need a
    # paid instance type. Re-running migrate on every boot is harmless: it
    # is idempotent and exits immediately once the tables exist.
    #
    # 2 workers fits the free plan's 512 MB. The long timeout is deliberate:
    # the vision model regularly takes more than the default 30 seconds, and
    # gunicorn would otherwise kill the request mid-answer.
    # seed_data fills in the sample destinations, places, transport rates and
    # distances. Every one of its writes is an update_or_create, so running it
    # on each boot is idempotent - it refreshes the sample rows and never
    # duplicates them. The free plan has no shell and no one-off jobs, so this
    # is the only place the seeding can happen.
    #
    # ensure_admin replaces createsuperuser here. createsuperuser refuses to
    # touch a username that already exists - it failed every boot with "That
    # username is already taken", the `|| true` hid it, and the password in
    # DJANGO_SUPERUSER_PASSWORD was never applied. ensure_admin creates the
    # account when missing and otherwise resets its password, so the variable
    # in the Dashboard is always the password that actually works. It is a
    # no-op when no password is set, so it needs no `|| true`.
    startCommand: >-
      python manage.py migrate --no-input &&
      python manage.py seed_data &&
      python manage.py ensure_admin &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --timeout 120
    envVars:
      # Render generates a fresh secret key on the first deploy. Never reuse
      # the development key from .env here.
      - key: SECRET_KEY
        generateValue: true

      # settings.py already turns DEBUG off whenever RENDER is set; this is
      # belt and braces, and makes the intent obvious in the Dashboard.
      - key: DEBUG
        value: "False"

      # ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS pick up the .onrender.com
      # address automatically from RENDER_EXTERNAL_HOSTNAME. Add your own
      # domain to ALLOWED_HOSTS here once you have one.

      # Resolved by name against the travel-db entry below, so this always
      # points at the current database even if it has to be recreated.
      - key: DATABASE_URL
        fromDatabase:
          name: travel-db
          property: connectionString

      # The Groq key is a secret, so Render asks for it in the Dashboard
      # rather than storing it in this file.
      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_CHAT_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3

      - key: PYTHON_VERSION
        value: "3.12.7"

      # Outgoing mail, used by "forgot password". Until EMAIL_HOST_PASSWORD is
      # filled in on the Dashboard, settings.py falls back to the console
      # backend and reset links appear in the service logs instead of being
      # sent - the flow still works end to end, it just does not leave the box.
      #
      # For Gmail this must be an App Password (Google Account -> Security ->
      # App passwords), not the normal account password. Google stopped
      # accepting plain passwords for SMTP in 2022.
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: yerradhikesh@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false

      # Admin login for /manage/ and /admin/. The account is only created once
      # you set a password in the Dashboard - until then the createsuperuser
      # step in startCommand is skipped harmlessly.
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: yerradhikesh@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  # The region MUST match the web service above. Render's private network does
  # not cross regions, so a Singapore service cannot resolve an Oregon
  # database's internal hostname - it fails with "failed to resolve host
  # dpg-...". Leaving this out is what broke the first deploy: the service
  # was pinned to singapore and the database quietly defaulted to oregon.
  - name: travel-db
    databaseName: travel_planner
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
